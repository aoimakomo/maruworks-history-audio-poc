<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MARUWORKS GPS PoC</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;background:#f7f8f5;color:#24352b}h1{font-size:1.5rem}section{background:white;padding:18px;border-radius:12px;margin:12px 0}button,select{padding:12px;font-size:1rem;margin:4px;border-radius:8px;border:1px solid #aab}button{background:#315e48;color:white}button:disabled{opacity:.5}strong{font-size:1.2rem}small{color:#555}#status{font-weight:bold}pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;max-height:160px;overflow:auto}</style></head><body>
<h1>MARUWORKS｜GPS距離テスト</h1><p>指定地点への接近を検出するための実験ページです。位置データはこのページ内だけで扱い、サーバーには送信しません。</p>
<section><button id="start">位置情報を開始</button><button id="stop" disabled>停止</button><p id="status">未開始</p><div>緯度・経度：<span id="coords">—</span></div><div>推定精度：<strong id="accuracy">—</strong></div><div>最終更新：<span id="updated">—</span></div></section>
<section><button id="setpoint" disabled>今の位置をテスト地点に登録</button><p>登録地点：<span id="point">未登録</span></p><label>判定半径：<select id="radius"><option value="5">5m</option><option value="10">10m</option><option value="20" selected>20m</option><option value="50">50m</option></select></label><p>地点までの距離：<strong id="distance">—</strong></p><p>判定：<strong id="result">—</strong></p><button id="sound">通知音を試す</button><p><small>GPSの推定精度が判定半径より悪い場合、結果は参考値です。音は「範囲外→範囲内」で一度だけ鳴ります。初回の音声再生にはボタン操作が必要な端末があります。</small></p></section>
<section><b>測定ログ（最新20件）</b><pre id="log">まだ測定していません</pre></section>
<script>
let watchId=null, latest=null, point=null, wasInside=null, audioContext=null;const $=id=>document.getElementById(id);
function log(s){let lines=$('log').textContent==='まだ測定していません'?[]:$('log').textContent.split('\n');$('log').textContent=[new Date().toLocaleTimeString()+' '+s,...lines].slice(0,20).join('\n')}
function meters(a,b){const R=6371000,rad=Math.PI/180,dLat=(b.latitude-a.latitude)*rad,dLon=(b.longitude-a.longitude)*rad,x=Math.sin(dLat/2)**2+Math.cos(a.latitude*rad)*Math.cos(b.latitude*rad)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function beep(){try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=740;g.gain.setValueAtTime(.15,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.25);o.connect(g).connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.25)}catch(e){log('音の再生に失敗: '+e.message)}}
function evaluate(){if(!latest||!point){$('distance').textContent='—';$('result').textContent='—';return}const d=meters(latest,point),r=Number($('radius').value),inside=d<=r;$('distance').textContent=d.toFixed(1)+'m';$('result').textContent=inside?'範囲内':'範囲外';if(inside&&wasInside===false){beep();log('入場判定 '+d.toFixed(1)+'m')}wasInside=inside}
$('sound').onclick=beep;$('radius').onchange=()=>{wasInside=null;evaluate()};$('setpoint').onclick=()=>{point={latitude:latest.latitude,longitude:latest.longitude};$('point').textContent=point.latitude.toFixed(6)+', '+point.longitude.toFixed(6);wasInside=null;log('地点を登録');evaluate()};
$('start').onclick=()=>{if(!navigator.geolocation){$('status').textContent='このブラウザは位置情報に非対応です';return}if(watchId!==null)return;$('status').textContent='位置情報の許可・測定待ち';$('start').disabled=true;$('stop').disabled=false;watchId=navigator.geolocation.watchPosition(p=>{latest={latitude:p.coords.latitude,longitude:p.coords.longitude};$('coords').textContent=latest.latitude.toFixed(6)+', '+latest.longitude.toFixed(6);$('accuracy').textContent='±'+Math.round(p.coords.accuracy)+'m';$('updated').textContent=new Date(p.timestamp).toLocaleTimeString();$('status').textContent='測定中';$('setpoint').disabled=false;evaluate();log('位置更新 精度±'+Math.round(p.coords.accuracy)+'m')},e=>{$('status').textContent='位置情報エラー: '+e.message;log('エラー '+e.code+' '+e.message)},{enableHighAccuracy:true,maximumAge:0,timeout:20000})};
$('stop').onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;$('start').disabled=false;$('stop').disabled=true;$('status').textContent='停止中'};
</script></body></html>
